<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/icon-192.png" />
    <link rel="apple-touch-icon" href="/brand/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <link rel="manifest" href="/manifest.json" />
    <!-- iOS : seul moyen d'obtenir un vrai plein écran sans barre Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Toom" />
    <meta name="theme-color" content="#c8102e" />
    <title>Toom — We'll see tomorrow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      #splash {
        position: fixed;
        inset: 0;
        background: #f5c518;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.1rem;
        z-index: 9999;
      }
      #splash img {
        width: min(40vw, 170px);
        height: min(40vw, 170px);
        animation: splash-bounce 1.8s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
        filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.18));
      }
      #splash span {
        font-family: "Poppins", "Inter", sans-serif;
        font-style: italic;
        font-weight: 600;
        color: #7a1414;
        font-size: 1rem;
      }
      @keyframes splash-bounce {
        0%, 100% { transform: scale(1) rotate(0deg); }
        30% { transform: scale(1.08) rotate(-3deg); }
        60% { transform: scale(0.97) rotate(2deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="splash">
        <img src="/brand/icon-512.png" alt="Toom" />
        <span>We'll see tomorrow</span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
