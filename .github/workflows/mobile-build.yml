name: Build iOS (vérification de compilation)

# Ce job ne produit PAS d'IPA installable : signer une app iOS nécessite un
# compte Apple Developer (payant) + certificats + profils de provisioning,
# pas encore en place pour ce projet. Il sert à vérifier que le projet Xcode
# généré par Capacitor compile toujours après chaque changement du code web.
# Voir MOBILE_BUILD_INSTRUCTIONS.md pour étendre ce workflow une fois les
# certificats Apple disponibles (signature + export .ipa + upload TestFlight).
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "ios/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile-build.yml"

jobs:
  ios-sanity-check:
    name: iOS (compilation non signée)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Installer les dépendances web
        run: npm ci

      - name: Build web (Vite)
        run: npm run build

      - name: Synchroniser Capacitor (iOS)
        run: npx cap sync ios

      - name: Compiler le projet iOS (sans signer)
        working-directory: ios/App
        shell: bash
        run: |
          set +e
          xcodebuild -project App.xcodeproj -scheme App \
            -sdk iphonesimulator -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build > xcodebuild.log 2>&1
          code=$?
          tail -n 200 xcodebuild.log
          if [ $code -ne 0 ]; then
            tail -n 60 xcodebuild.log > xcodebuild-tail.log
            msg=$(python3 -c "print(open('xcodebuild-tail.log').read().replace('%','%25').replace(chr(13),'%0D').replace(chr(10),'%0A'))")
            echo "::error::xcodebuild a echoue (code $code) -- dernieres lignes : $msg"
            exit $code
          fi
